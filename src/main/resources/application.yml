spring:
  datasource:
    url: jdbc:h2:tcp://localhost:9092/./loanengine;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:test_data.sql

server:
  port: 8080
